
name: Collect Remote Jobs

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Collect remote job listings
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          url = "https://remotive.com/api/remote-jobs?limit=1000"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "OpenRoleGlobal/1.0"}
          )

          with urllib.request.urlopen(request, timeout=60) as response:
              data = json.load(response)

          today = datetime.now(timezone.utc).date().isoformat()
          jobs = []

          for job in data.get("jobs", []):
              jobs.append({
                  "job_id": "REM-" + str(job.get("id", "")),
                  "job_title": job.get("title", ""),
                  "company": job.get("company_name", ""),
                  "category": job.get("category", ""),
                  "eligible_countries": job.get(
                      "candidate_required_location", ""
                  ),
                  "salary": job.get("salary", ""),
                  "job_type": job.get("job_type", ""),
                  "date_posted": job.get("publication_date", ""),
                  "application_url": job.get("url", ""),
                  "source_url": job.get("url", ""),
                  "last_verified": today,
                  "status": "Pending Review"
              })

          Path("jobs.json").write_text(
              json.dumps(jobs, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )

          print(f"Collected {len(jobs)} remote-job listings.")
          PY

      - name: Save updated job data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update collected remote jobs"
            git push
          else
            echo "No changes to save."
          fi
